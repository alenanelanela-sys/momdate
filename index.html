<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой первый сайт</title>
    <style>
        /* Оформление страницы */
        body {
            background-color: #f4f4f9;
            color: #333;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            transition: 0.3s; /* Чтобы тема менялась плавно */
        }

        /* Стиль для темной темы */
        body.dark-mode {
            background-color: #1a1a1a;
            color: #f4f4f9;
        }

        p {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
        }

        body.dark-mode p {
            background-color: #333;
        }

        /* Стиль кнопки */
        button {
            margin-top: 20px;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background-color: #3498db;
            color: white;
            font-size: 16px;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>Привет!</h1>
    <p>Нажми на кнопку ниже, и магия JavaScript поменяет цвет всей страницы.</p>
    
    <button id="themeButton">Сменить тему</button>

    <script>
        // Ищем кнопку по её ID
        const btn = document.getElementById('themeButton');

        // Говорим кнопке, что делать при клике
        btn.onclick = function() {
            document.body.classList.toggle('dark-mode');
        };
    </script>

</body>
</html>
