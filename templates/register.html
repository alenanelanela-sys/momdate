<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание анкеты — mamaMatch</title>
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fdfbf7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .app-container { background: #ffffff; width: 350px; padding: 30px; border-radius: 40px; box-shadow: 0 20px 50px rgba(160, 140, 130, 0.12); border: 1px solid #f0eae4; box-sizing: border-box; }
        .logo { font-size: 22px; font-weight: 700; color: #1a1a1a; text-align: center; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .logo i { color: #e57373; }
        h2 { font-size: 18px; color: #1a1a1a; margin-top: 0; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { font-size: 13px; font-weight: 600; color: #5f6368; display: block; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border-radius: 14px; border: 1px solid #f0eae4; background: #faf8f5; font-size: 14px; color: #1a1a1a; box-sizing: border-box; outline: none; }
        input:focus { border-color: #e57373; background: #ffffff; }
        .btn-submit { background: #1a1a1a; color: white; border: none; width: 100%; padding: 14px; border-radius: 99px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        .btn-submit:hover { background: #e57373; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="logo"><i data-lucide="sparkles"></i> <span>mamaMatch</span></div>
        <h2>Создай свой профиль 🌸</h2>
        
        <form action="/register" method="post">
            <div class="form-group">
                <label>Как тебя зовут?</label>
                <input type="text" name="name" placeholder="Твое имя" required>
            </div>
            <div class="form-group">
                <label>В каком районе ты живешь?</label>
                <input type="text" name="district" placeholder="Например, Центральный" required>
            </div>
            <div class="form-group">
                <label>Возраст твоего малыша (в месяцах):</label>
                <input type="number" name="baby_age" placeholder="Например, 6" min="0" max="60" required>
            </div>
            <div class="form-group">
                <label>Твои интересы (через запятую):</label>
                <input type="text" name="interests" placeholder="Например: ГВ, Спорт, ИТ, Кофе" required>
            </div>
            <button type="submit" class="btn-submit">Сохранить и смотреть анкеты</button>
        </form>
    </div>
    <script>lucide.createIcons();</script>

    <!-- Подключаем мост ВКонтакте, чтобы убрать ошибку инициализации -->
    <script src="https://unpkg.com"></script>
    <script>
        vkBridge.send('VKWebAppInit');
    </script>
</body>
</html>
