<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👶 МамДейт — Пространство для мам</title>
    
    <!-- Подключаем супер-современные иконки Lucide (тонкие, минималистичные линии) -->
    <script src="https://unpkg.com"></script>
    
    <style>
        /* Минималистичный европейский фон в пастельных тонах */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #fdfbf7; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }

        /* Корпус приложения в стиле минимализма Apple */
        .app-container {
            background: #ffffff;
            width: 360px;
            height: 640px;
            padding: 24px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(160, 140, 130, 0.12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #f0eae4;
            position: relative;
            box-sizing: border-box;
        }

        /* Трендовая аккуратная шапка */
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .logo i {
            color: #e57373;
            stroke-width: 2.5;
        }

        /* Элегантный баннер мэтча */
        .match-banner {
            background: #e6f4ea;
            color: #137333;
            padding: 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: absolute;
            top: 65px;
            left: 24px;
            right: 24px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .match-banner i { stroke-width: 2.5; }

        /* Изящная карточка профиля */
        .mom-card {
            background: #faf8f5;
            border-radius: 32px;
            padding: 24px;
            border: 1px solid #f0eae4;
            flex-grow: 1;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease;
        }

        /* Аватарка в стиле дорогого бренд-дизайна */
        .avatar-box {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffccd5 0%, #fbc4ab 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -1px;
            box-shadow: 0 10px 20px rgba(251, 196, 171, 0.3);
            border: 4px solid #ffffff;
        }

        .mom-name {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin: 0 0 16px 0;
            letter-spacing: -0.3px;
        }

        /* Блок мета-данных с тонкими линиями иконок */
        .mom-meta {
            font-size: 14px;
            color: #5f6368;
            width: 100%;
            margin-bottom: 20px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid #f0eae4;
        }

        .meta-item i {
            color: #9aa0a6;
            width: 18px;
            height: 18px;
            stroke-width: 2;
        }

        /* Современные минималистичные теги */
        .interests-box {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            width: 100%;
            margin-top: auto;
        }

        .tag {
            background: #ffffff;
            color: #202124;
            padding: 8px 14px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid #f0eae4;
        }

        /* Кнопки управления как в современных премиум-приложениях */
        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding-bottom: 5px;
        }

        .action-btn {
            border: none;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 1px solid #f0eae4;
            box-shadow: 0 8px 16px rgba(165, 150, 140, 0.08);
        }

        .action-btn i {
            width: 24px;
            height: 24px;
            stroke-width: 2.2;
        }

        .btn-dislike { color: #5f6368; }
        .btn-dislike:hover { 
            transform: scale(1.08); 
            color: #e53e3e; 
            background: #fff5f5;
            border-color: #fed7d7; 
        }

        .btn-like { 
            background: #1a1a1a; 
            color: #ffffff;
            border: none;
        }
        .btn-like:hover { 
            transform: scale(1.08); 
            background: #e57373;
            box-shadow: 0 10px 20px rgba(229, 115, 115, 0.3);
        }

        /* Конец ленты */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
        }
        .empty-state i { color: #dbd3cb; stroke-width: 1.5; }
        .empty-state h2 { color: #1a1a1a; font-size: 18px; margin: 0; }
        
        .reset-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            padding: 12px 24px;
            border-radius: 99px;
            background: #ffffff;
            border: 1px solid #f0eae4;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: 0.2s;
        }
        .reset-link:hover { background: #faf8f5; transform: translateY(-1px); }

        @keyframes slideDown { 0% { transform: translateY(-20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { 0% { transform: translateY(8px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Шапка -->
        <div class="logo">
            <i data-lucide="sparkles"></i>
            <span>МамДейт</span>
        </div>
        
        <!-- Баннер совпадения -->
        {% if match_message %}
            <div class="match-banner">
                <i data-lucide="zap"></i>
                <span>{{ match_message }}</span>
            </div>
        {% endif %}

        <!-- Карточка -->
        {% if mom %}
            <div class="mom-card">
                <!-- Минималистичный текстовый аватар -->
                <div class="avatar-box">
                    {{ mom.name[0] }}
                </div>

                <h2 class="mom-name">{{ mom.name }}</h2>
                
                <div class="mom-meta">
                    <div class="meta-item">
                        <i data-lucide="map-pin"></i>
                        <span><b>Район:</b> {{ mom.district }}</span>
                    </div>
                    <div class="meta-item">
                        <i data-lucide="smile"></i>
                        <span><b>Малышу:</b> {{ mom.baby_age }} мес.</span>
                    </div>
                </div>
                
                <div class="interests-box">
                    {% for interest in mom.interests.split(', ') %}
                        <span class="tag">{{ interest }}</span>
                    {% endfor %}
                </div>
            </div>
            
            <!-- Кнопки с ультра-модными тонкими иконками -->
            <form action="/swipe" method="post" class="buttons-container">
                <input type="hidden" name="mom_id" value="{{ mom.id }}">
                <button type="submit" name="action" value="dislike" class="action-btn btn-dislike">
                    <i data-lucide="x"></i>
                </button>
                <button type="submit" name="action" value="like" class="action-btn btn-like">
                    <i data-lucide="heart"></i>
                </button>
            </form>
        {% else %}
            <!-- Конец ленты -->
            <div class="empty-state">
                <i data-lucide="box" style="width: 48px; height: 48px;"></i>
                <h2>Анкеты закончились</h2>
                <a href="/reset" class="reset-link">
                    <i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i> Сначала
                </a>
            </div>
        {% endif %}
    </div>

    <!-- Скрипт, который превращает теги <i data-lucide="..."> в дизайнерские иконки -->
    <script>
        lucide.createIcons();
    </script>
  <script src="https://unpkg.com"></script>
<script>vkBridge.send('VKWebAppInit');</script>
</body>
</html>
